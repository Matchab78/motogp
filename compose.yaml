services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: f1
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: ${F1_PASSWORD:?Définir F1_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - f1_data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./import.sql:/scripts/import.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  f1_data:
